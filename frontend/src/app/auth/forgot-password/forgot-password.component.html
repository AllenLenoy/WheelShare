<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Forgot Password</h2>
            <p>Enter your email to receive a password reset link</p>
        </div>

        <form [formGroup]="forgotPasswordForm" (ngSubmit)="submit()">
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input
                    type="email"
                    id="email"
                    formControlName="email"
                    class="form-control"
                    placeholder="Enter your email"
                >
                <small class="error" *ngIf="forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.hasError('required')">
                    Email is required.
                </small>
                <small class="error" *ngIf="forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.hasError('email')">
                    Please enter a valid email.
                </small>
            </div>

            <button type="submit" class="btn-primary btn-submit" [disabled]="forgotPasswordForm.invalid || isLoading">
                {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
            </button>
        </form>

        <p class="auth-footer" style="margin-top: 20px;">
            Remember your password?
            <a routerLink="/auth/login">Login</a>
        </p>
    </div>
</div>
