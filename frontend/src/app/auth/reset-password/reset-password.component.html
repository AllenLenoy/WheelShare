<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Reset Password</h2>
            <p>Please enter your new password</p>
        </div>

        <form [formGroup]="resetPasswordForm" (ngSubmit)="submit()">
            <div class="form-group">
                <label for="password" class="form-label">New Password</label>
                <input
                    type="password"
                    id="password"
                    formControlName="password"
                    class="form-control"
                    placeholder="Enter new password"
                >
                <small class="error" *ngIf="resetPasswordForm.get('password')?.touched && resetPasswordForm.get('password')?.hasError('required')">
                    Password is required.
                </small>
                <small class="error" *ngIf="resetPasswordForm.get('password')?.touched && resetPasswordForm.get('password')?.hasError('minlength')">
                    Password must be at least 6 characters.
                </small>
            </div>

            <button type="submit" class="btn-primary btn-submit" [disabled]="resetPasswordForm.invalid || isLoading">
                {{ isLoading ? 'Resetting...' : 'Reset Password' }}
            </button>
        </form>

    </div>
</div>
