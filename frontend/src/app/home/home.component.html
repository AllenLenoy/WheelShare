<!-- ========== HERO SECTION ========== -->
<header class="hero">
    <!-- Hero Background Video -->
    <div class="hero-bg">
        <video
          autoplay
          muted
          loop
          playsinline
          class="hero-bg-video"
          poster="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=1920&q=80">
          <source src="https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4" type="video/mp4">
        </video>
        <!-- Gradient Overlay for legibility -->
        <div class="hero-overlay"></div>
    </div>

    <div class="hero-content">
        <h1 class="hero-title">
            Drive the Future of <br class="hide-mobile" style="display:block"> <span class="text-primary">Mobility</span>
        </h1>
        
        <p class="hero-subtitle">
            Experience the thrill of the open road in the world's most desirable vehicles. Rent directly from trusted local hosts and elevate your journey.
        </p>

        <!-- Search Widget (Glassmorphism) -->
        <div class="search-widget">
            <!-- Location -->
            <div class="search-field">
                <span class="material-symbols-outlined search-icon">location_on</span>
                <select class="search-input appearance-none" [(ngModel)]="searchLocation">
                    <option disabled hidden selected value="">City, Airport, or Address</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Kochi">Kochi</option>
                    <option value="Hyderabad">Hyderabad</option>
                </select>
            </div>
            
            <!-- Dates -->
            <div class="search-field">
                <span class="material-symbols-outlined search-icon">calendar_today</span>
                <input #dateInput class="search-input" [(ngModel)]="searchDates" placeholder="Pick-up & Drop-off" type="text" (focus)="dateInput.type='date'" (blur)="!searchDates ? dateInput.type='text' : null" />
            </div>
            
            <!-- Vehicle Type -->
            <div class="search-field hide-mobile">
                <span class="material-symbols-outlined search-icon">directions_car</span>
                <select class="search-input appearance-none" [(ngModel)]="searchType">
                    <option disabled hidden selected value="">Vehicle Type</option>
                    <option value="Car">Car</option>
                    <option value="Bike">Bike</option>
                    <option value="Scooter">Scooter</option>
                </select>
            </div>
            
            <!-- Search Button -->
            <button class="btn-primary search-btn" (click)="onSearch()">
                <span class="material-symbols-outlined">search</span>
                Find a Car
            </button>
        </div>
    </div>
</header>
