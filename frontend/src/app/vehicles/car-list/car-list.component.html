<main class="page-layout">
    
    <!-- Sidebar Filters -->
    <aside class="sidebar-filters">
        <div class="filter-header">Filters</div>
        
        <!-- Price Range -->
        <div class="filter-section">
            <label>Max Price per day</label>
            <span class="filter-value">₹{{ maxPrice || 'Any' }}</span>
            <input type="range" class="range-slider" min="500" max="15000" step="500" [(ngModel)]="maxPrice" (change)="applyFilters()">
        </div>
        
        <!-- Vehicle Type -->
        <div class="filter-section">
            <label>Vehicle Type</label>
            <select class="form-control" [(ngModel)]="selectedType" (change)="applyFilters()" style="appearance: none; cursor: pointer;">
                <option value="">All Types</option>
                <option *ngFor="let type of types" [value]="type">{{ type }}</option>
            </select>
        </div>
        
        <!-- Fuel -->
        <div class="filter-section">
            <label>Fuel Type</label>
            <select class="form-control" [(ngModel)]="selectedFuel" (change)="applyFilters()" style="appearance: none; cursor: pointer;">
                <option value="">All Fuels</option>
                <option *ngFor="let fuel of fuelTypes" [value]="fuel">{{ fuel }}</option>
            </select>
        </div>
        
        <!-- Transmission -->
        <div class="filter-section">
            <label>Transmission</label>
            <select class="form-control" [(ngModel)]="selectedTransmission" (change)="applyFilters()" style="appearance: none; cursor: pointer;">
                <option value="">All Transmissions</option>
                <option *ngFor="let trans of transmissions" [value]="trans">{{ trans }}</option>
            </select>
        </div>
        
        <!-- Location -->
        <div class="filter-section">
            <label>Location</label>
            <select class="form-control" [(ngModel)]="selectedLocation" (change)="applyFilters()" style="appearance: none; cursor: pointer;">
                <option value="">All Locations</option>
                <option *ngFor="let loc of locations" [value]="loc">{{ loc }}</option>
            </select>
        </div>
        
        <button class="btn-ghost" style="width: 100%" *ngIf="activeFilterCount > 0" (click)="clearFilters()">
            Clear Filters ({{ activeFilterCount }})
        </button>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Results Header -->
        <div class="results-header">
            <div>
                <h1>Available Vehicles</h1>
                <p>{{ filteredVehicles.length }} vehicles found</p>
            </div>
            
            <!-- Search -->
            <div class="search-bar">
                <span class="material-symbols-outlined">search</span>
                <input type="text" placeholder="Search brand, model, location..." [(ngModel)]="searchQuery" (input)="applyFilters()">
            </div>
        </div>

        <!-- Loading State (Skeletons) -->
        <div class="skeleton-grid" *ngIf="isLoading">
            <div class="skeleton-card" *ngFor="let i of [1, 2, 3, 4, 5, 6]">
                <div class="skeleton-img"></div>
                <div class="skeleton-content">
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line short"></div>
                    <div class="skeleton-line price"></div>
                </div>
            </div>
        </div>

        <!-- Vehicle Grid -->
        <div class="vehicle-grid" *ngIf="!isLoading && filteredVehicles.length > 0">
            <app-vehicle-card
                *ngFor="let vehicle of filteredVehicles"
                [vehicle]="vehicle"
            ></app-vehicle-card>
        </div>

        <!-- Empty State -->
        <div class="empty-state" *ngIf="!isLoading && filteredVehicles.length === 0">
            <span class="material-symbols-outlined" style="font-size: 48px; color: var(--clr-outline);">directions_car</span>
            <h3>No vehicles found</h3>
            <p>Try adjusting your filters or search query.</p>
            <button class="btn-primary" (click)="clearFilters()">Clear All Filters</button>
        </div>

    </div>
</main>
